<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Crest / Icon Graphic -->
  <g transform="translate(6, 6)">
    <!-- Shield/Rounded Hexagon Background -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#grad1)" />
    
    <!-- Academic & Computing Icon: Circuit + Cap/Book outline -->
    <path d="M 24 10 L 38 18 L 24 26 L 10 18 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 15 22 L 15 31 C 15 35 33 35 33 31 L 33 22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="24" cy="38" r="3" fill="#38bdf8" />
    <line x1="24" y1="33" x2="24" y2="35" stroke="#38bdf8" stroke-width="2" />
    <circle cx="12" cy="27" r="2" fill="#38bdf8" />
    <circle cx="36" cy="27" r="2" fill="#38bdf8" />
    <line x1="12" y1="21" x2="12" y2="25" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="36" y1="21" x2="36" y2="25" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(64, 18)">
    <!-- System Acronym & University Tag -->
    <text x="0" y="8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="1">DCMS<tspan fill="#0284c7" font-weight="700">.RUSL</tspan></text>
    <text x="0" y="24" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.4">DEPARTMENT OF COMPUTING</text>
    <text x="0" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="8" font-weight="500" fill="#94a3b8" letter-spacing="0.2">Faculty of Applied Sciences</text>
  </g>
</svg>
